<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS-SPHERE — Galeri Karya</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
</head>
<body class="page-peta">

  <a href="index.html" class="back-link"><span class="back-icon">&larr;</span> Kembali ke Beranda</a>

  <div class="page-header">
    <h1 class="page-title">Galeri Karya</h1>
    <p class="page-subtitle">Menampilkan hasil karya autentik murid dalam bentuk video, infografis, atau poster</p>
  </div>

  <div class="gallery-tabs">
    <button class="gallery-tab active" data-type="semua">Semua</button>
    <button class="gallery-tab" data-type="video">Video</button>
    <button class="gallery-tab" data-type="infografis">Infografis</button>
    <button class="gallery-tab" data-type="poster">Poster</button>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>
  <p class="gallery-kosong" id="galleryKosong" hidden>Belum ada karya untuk kategori ini.</p>

  <nav class="bottom-nav">
    <div class="nav-item"><a href="peta.html" style="all:unset;color:inherit;display:flex;flex-direction:column;align-items:center;gap:.25rem;">🗺️<span>Peta Interaktif</span></a></div>
    <div class="nav-item"><a href="panduan.html" style="all:unset;color:inherit;display:flex;flex-direction:column;align-items:center;gap:.25rem;">📖<span>Panduan</span></a></div>
    <div class="nav-item"><a href="papan_skor.html" style="all:unset;color:inherit;display:flex;flex-direction:column;align-items:center;gap:.25rem;">📊<span>Progres</span></a></div>
    <div class="nav-item"><a href="pengaturan.html" style="all:unset;color:inherit;display:flex;flex-direction:column;align-items:center;gap:.25rem;">⚙️<span>Pengaturan</span></a></div>
  </nav>

  <script>
    /* ============================================================
       DAFTAR KARYA — tambah karya baru cukup salin satu blok di
       bawah ini. "type" harus salah satu dari: video, infografis, poster.
       Ganti isi contoh di bawah dengan karya asli kelompok kamu.
       ============================================================ */
    const KARYA = [
      { type: 'video',      judul: 'Contoh judul video',      kelompok: 'Kelompok 1', ikon: '🎬' },
      { type: 'infografis', judul: 'Contoh judul infografis',  kelompok: 'Kelompok 2', ikon: '🖼️' },
      { type: 'poster',     judul: 'Contoh judul poster',      kelompok: 'Kelompok 3', ikon: '🎨' }
    ];

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function bangunKartu(k) {
      const card = el('div', 'gallery-card');
      card.dataset.type = k.type;
      const thumb = el('div', 'gallery-thumb', k.ikon);
      if (k.type === 'video') thumb.appendChild(el('span', 'play-icon', '▶️'));
      card.appendChild(thumb);
      const body = el('div', 'gallery-body');
      body.appendChild(el('h4', null, k.judul));
      body.appendChild(el('div', 'gallery-meta', k.kelompok));
      card.appendChild(body);
      return card;
    }

    const grid = document.getElementById('galleryGrid');
    const kosong = document.getElementById('galleryKosong');
    KARYA.forEach(k => grid.appendChild(bangunKartu(k)));

    function terapkanFilter(type) {
      let terlihat = 0;
      document.querySelectorAll('.gallery-card').forEach(card => {
        const tampil = type === 'semua' || card.dataset.type === type;
        card.classList.toggle('hidden', !tampil);
        if (tampil) terlihat++;
      });
      kosong.hidden = terlihat > 0;
    }

    document.querySelectorAll('.gallery-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.gallery-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        terapkanFilter(tab.dataset.type);
      });
    });

    terapkanFilter('semua');
  </script>

</body>
</html>
